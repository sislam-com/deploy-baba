name: Deploy Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_DEV_ROLE_ARN }}
          aws-region: us-east-1

      # ── Load deploy identifiers from Secrets Manager ──────────────────────────
      # SPA_BUCKET, CLOUDFRONT_ID, UI_FN_NAME, FN_URL are stored in SM (W-SEC).
      # Only the bootstrap role ARN lives in GitHub Variables.

      - name: Load deploy config from Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id deploy-baba/dev/deploy-config \
            --query SecretString --output text)
          echo "SPA_BUCKET=$(echo "$SECRET" | jq -r .spa_bucket)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_ID=$(echo "$SECRET" | jq -r .cloudfront_id)" >> "$GITHUB_ENV"
          echo "UI_FN_NAME=$(echo "$SECRET" | jq -r .ui_fn_name)" >> "$GITHUB_ENV"
          echo "AGENT_FN_NAME=$(echo "$SECRET" | jq -r .agent_fn_name)" >> "$GITHUB_ENV"
          echo "EMAIL_FN_NAME=$(echo "$SECRET" | jq -r .email_fn_name)" >> "$GITHUB_ENV"
          echo "LLM_PROXY_FN_NAME=$(echo "$SECRET" | jq -r .llm_proxy_fn_name)" >> "$GITHUB_ENV"
          echo "AUTH_FN_NAME=$(echo "$SECRET" | jq -r .auth_fn_name)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_FN_NAME=$(echo "$SECRET" | jq -r .portfolio_fn_name)" >> "$GITHUB_ENV"
          echo "ADMIN_FN_NAME=$(echo "$SECRET" | jq -r .admin_fn_name)" >> "$GITHUB_ENV"
          echo "CONTACT_FN_NAME=$(echo "$SECRET" | jq -r .contact_fn_name)" >> "$GITHUB_ENV"
          echo "RAG_FN_NAME=$(echo "$SECRET" | jq -r .rag_fn_name)" >> "$GITHUB_ENV"
          echo "MCP_GATEWAY_FN_NAME=$(echo "$SECRET" | jq -r .mcp_gateway_fn_name)" >> "$GITHUB_ENV"
          echo "FN_URL=$(echo "$SECRET" | jq -r .fn_url)" >> "$GITHUB_ENV"

      # ── Build Lambda ──────────────────────────────────────────────────────────

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build Lambda binary
        run: |
          cargo lambda build --release --package deploy-baba-ui --target aarch64-unknown-linux-gnu
          mkdir -p infra/build
          zip -j infra/build/lambda.zip target/lambda/deploy-baba-ui/bootstrap

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$UI_FN_NAME" \
            --zip-file fileb://infra/build/lambda.zip \
            --architectures arm64 \
            --region us-east-1

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$UI_FN_NAME" \
            --region us-east-1

      - name: Force UI Lambda cold start (runs migrations)
        run: |
          aws lambda invoke \
            --function-name "$UI_FN_NAME" \
            --payload '{"action":"health"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/health-response.json \
            --region us-east-1
          echo "UI Lambda cold start response:"
          cat /tmp/health-response.json

      # ── Build + deploy Agent Lambda ──────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build agent Lambda zip
        run: |
          mkdir -p build/agent-lambda infra/build
          cd services/agent
          uv export --frozen --no-dev --no-emit-project > /tmp/agent-requirements.txt
          pip install --target ../../build/agent-lambda -r /tmp/agent-requirements.txt --quiet
          cp -r src/* ../../build/agent-lambda/
          cd ../../build/agent-lambda
          zip -qr ../../infra/build/agent-lambda.zip .

      - name: Update agent Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$AGENT_FN_NAME" \
            --zip-file fileb://infra/build/agent-lambda.zip \
            --region us-east-1

      - name: Wait for agent Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$AGENT_FN_NAME" \
            --region us-east-1

      # ── Build + deploy the remaining Rust service Lambdas ─────────────────────
      # email/llm-proxy/auth/portfolio/admin/contact/rag each build+deploy the
      # same way as the UI Lambda above — looped to avoid 7x copy-pasted steps.
      # Keeps dev fully fresh so `just promote` always has correct artifacts to
      # copy to prod for every service, not just ui/agent.

      - name: Build + deploy remaining service Lambdas
        run: |
          set -euo pipefail
          declare -A PKG=(
            [EMAIL_FN_NAME]=email-lambda
            [LLM_PROXY_FN_NAME]=llm-proxy
            [AUTH_FN_NAME]=auth-lambda
            [PORTFOLIO_FN_NAME]=portfolio-lambda
            [ADMIN_FN_NAME]=admin-lambda
            [CONTACT_FN_NAME]=contact-lambda
            [RAG_FN_NAME]=rag-lambda
          )
          for var in "${!PKG[@]}"; do
            pkg="${PKG[$var]}"
            fn_name="${!var}"
            echo "── Building ${pkg} → ${fn_name} ──"
            cargo lambda build --release --package "$pkg" --target aarch64-unknown-linux-gnu
            zip -j "infra/build/${pkg}.zip" "target/lambda/${pkg}/bootstrap"
            aws lambda update-function-code \
              --function-name "$fn_name" \
              --zip-file "fileb://infra/build/${pkg}.zip" \
              --architectures arm64 \
              --region us-east-1
            aws lambda wait function-updated \
              --function-name "$fn_name" \
              --region us-east-1
          done

      # ── Build + deploy the MCP gateway Lambda ─────────────────────────────────
      # Its build (mcp-cloud-build) bundles plan/ADR/migration context alongside
      # the binary and is nontrivial enough to keep as a single justfile recipe
      # rather than duplicating it here — install `just` and reuse it directly.

      - uses: extractions/setup-just@v3

      - name: Build MCP gateway Lambda zip
        run: just mcp-cloud-build

      - name: Update MCP gateway Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$MCP_GATEWAY_FN_NAME" \
            --zip-file fileb://infra/build/mcp-gateway-lambda.zip \
            --architectures arm64 \
            --region us-east-1

      - name: Wait for MCP gateway Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$MCP_GATEWAY_FN_NAME" \
            --region us-east-1

      # ── Build + deploy SPA ────────────────────────────────────────────────────

      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: cargo run -q -p api-openapi --bin emit-spec > web/openapi.json

      - name: Generate TypeScript types
        run: pnpm --dir web exec openapi-typescript openapi.json -o src/api/types.gen.ts

      - name: Build SPA
        run: pnpm --dir web run build

      - name: Sync SPA to S3
        run: |
          aws s3 sync web/dist/ "s3://${SPA_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp web/dist/index.html "s3://${SPA_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          if [ -z "$CLOUDFRONT_ID" ]; then
            echo "No CloudFront distribution — skipping invalidation"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/index.html" "/"

      # ── Smoke test ────────────────────────────────────────────────────────────

      - name: Smoke test /health
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${FN_URL}/health" || echo "000")
          echo "Health check status: ${STATUS}"
          [[ "${STATUS}" == "200" ]]

      # ── Tag dev release ───────────────────────────────────────────────────────

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify worktree clean before tag
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Worktree dirty before release tag — see diff below"
            git status --porcelain
            git diff --stat
            git diff -- Cargo.lock web/pnpm-lock.yaml web/package.json | head -100
            exit 1
          fi

      - name: Create dev-vX.Y.Z tag
        run: cargo run -q -p xtask -- release tag --kind dev --push

      # Promotion to prod is explicit — dispatch promote.yml (`just promote`)
      # after verifying this dev-vX.Y.Z build on dev.sislam.com (ADR-029,
      # W-PROM.4.25). Prod no longer ships automatically on every push.
