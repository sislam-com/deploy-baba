name: Deploy Prod

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_PROD_ROLE_ARN }}
          aws-region: us-east-1

      # ── Load deploy identifiers from Secrets Manager ──────────────────────────

      - name: Load deploy config from Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id deploy-baba/prod/deploy-config \
            --query SecretString --output text)
          echo "SPA_BUCKET=$(echo "$SECRET" | jq -r .spa_bucket)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_ID=$(echo "$SECRET" | jq -r .cloudfront_id)" >> "$GITHUB_ENV"
          echo "UI_FN_NAME=$(echo "$SECRET" | jq -r .ui_fn_name)" >> "$GITHUB_ENV"
          echo "AGENT_FN_NAME=$(echo "$SECRET" | jq -r .agent_fn_name)" >> "$GITHUB_ENV"
          echo "EMAIL_FN_NAME=$(echo "$SECRET" | jq -r .email_fn_name)" >> "$GITHUB_ENV"
          echo "LLM_PROXY_FN_NAME=$(echo "$SECRET" | jq -r .llm_proxy_fn_name)" >> "$GITHUB_ENV"
          echo "AUTH_FN_NAME=$(echo "$SECRET" | jq -r .auth_fn_name)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_FN_NAME=$(echo "$SECRET" | jq -r .portfolio_fn_name)" >> "$GITHUB_ENV"
          echo "ADMIN_FN_NAME=$(echo "$SECRET" | jq -r .admin_fn_name)" >> "$GITHUB_ENV"
          echo "CONTACT_FN_NAME=$(echo "$SECRET" | jq -r .contact_fn_name)" >> "$GITHUB_ENV"
          echo "RAG_FN_NAME=$(echo "$SECRET" | jq -r .rag_fn_name)" >> "$GITHUB_ENV"
          echo "MCP_GATEWAY_FN_NAME=$(echo "$SECRET" | jq -r .mcp_gateway_fn_name)" >> "$GITHUB_ENV"
          echo "FN_URL=$(echo "$SECRET" | jq -r .fn_url)" >> "$GITHUB_ENV"

      # ── Build Lambda ──────────────────────────────────────────────────────────

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build Lambda binary
        run: |
          cargo lambda build --release --package deploy-baba-ui --target aarch64-unknown-linux-gnu
          mkdir -p infra/build
          zip -j infra/build/lambda.zip target/lambda/deploy-baba-ui/bootstrap

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$UI_FN_NAME" \
            --zip-file fileb://infra/build/lambda.zip \
            --architectures arm64 \
            --region us-east-1

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$UI_FN_NAME" \
            --region us-east-1

      # ── Build + deploy Agent Lambda ──────────────────────────────────────────

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build agent Lambda zip
        run: |
          mkdir -p build/agent-lambda infra/build
          cd services/agent
          uv export --frozen --no-dev --no-emit-project > /tmp/agent-requirements.txt
          pip install --target ../../build/agent-lambda -r /tmp/agent-requirements.txt --quiet
          cp -r src/* ../../build/agent-lambda/
          cd ../../build/agent-lambda
          zip -qr ../../infra/build/agent-lambda.zip .

      - name: Update agent Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$AGENT_FN_NAME" \
            --zip-file fileb://infra/build/agent-lambda.zip \
            --region us-east-1

      - name: Wait for agent Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$AGENT_FN_NAME" \
            --region us-east-1

      # ── Build + deploy the remaining Rust service Lambdas ─────────────────────
      # Rebuild fallback for parity with deploy-dev.yml (env-promote.md W-PROM) —
      # the primary path to prod is `just promote` (artifact copy from dev);
      # this workflow only runs on a direct vX.Y.Z tag push.

      - name: Build + deploy remaining service Lambdas
        run: |
          set -euo pipefail
          declare -A PKG=(
            [EMAIL_FN_NAME]=email-lambda
            [LLM_PROXY_FN_NAME]=llm-proxy
            [AUTH_FN_NAME]=auth-lambda
            [PORTFOLIO_FN_NAME]=portfolio-lambda
            [ADMIN_FN_NAME]=admin-lambda
            [CONTACT_FN_NAME]=contact-lambda
            [RAG_FN_NAME]=rag-lambda
          )
          for var in "${!PKG[@]}"; do
            pkg="${PKG[$var]}"
            fn_name="${!var}"
            echo "── Building ${pkg} → ${fn_name} ──"
            cargo lambda build --release --package "$pkg" --target aarch64-unknown-linux-gnu
            zip -j "infra/build/${pkg}.zip" "target/lambda/${pkg}/bootstrap"
            aws lambda update-function-code \
              --function-name "$fn_name" \
              --zip-file "fileb://infra/build/${pkg}.zip" \
              --architectures arm64 \
              --region us-east-1
            aws lambda wait function-updated \
              --function-name "$fn_name" \
              --region us-east-1
          done

      # ── Build + deploy the MCP gateway Lambda ─────────────────────────────────

      - uses: extractions/setup-just@v3

      - name: Build MCP gateway Lambda zip
        run: just mcp-cloud-build

      - name: Update MCP gateway Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$MCP_GATEWAY_FN_NAME" \
            --zip-file fileb://infra/build/mcp-gateway-lambda.zip \
            --architectures arm64 \
            --region us-east-1

      - name: Wait for MCP gateway Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$MCP_GATEWAY_FN_NAME" \
            --region us-east-1

      # ── Build + deploy SPA ────────────────────────────────────────────────────

      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: cargo run -q -p api-openapi --bin emit-spec > web/openapi.json

      - name: Generate TypeScript types
        run: pnpm --dir web exec openapi-typescript openapi.json -o src/api/types.gen.ts

      - name: Build SPA
        run: pnpm --dir web run build

      - name: Sync SPA to S3
        run: |
          aws s3 sync web/dist/ "s3://${SPA_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp web/dist/index.html "s3://${SPA_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          if [ -z "$CLOUDFRONT_ID" ]; then
            echo "No CloudFront distribution — skipping invalidation"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/index.html" "/"

      # ── Smoke test ────────────────────────────────────────────────────────────

      - name: Smoke test /health
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${FN_URL}/health" || echo "000")
          echo "Health check status: ${STATUS}"
          [[ "${STATUS}" == "200" ]]
